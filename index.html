<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gnome</title>
  <meta name="description" content="All your files in one place, searchable by meaning">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/main.css">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/gnome_favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/gnome_favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/gnome_favicon/favicon-16x16.png">
  <link rel="manifest" href="/static/gnome_favicon/site.webmanifest">
</head>

<body>
  <div class="bg">
    <div class="particle-waves">
      <div class="wave-layer wave-layer-1"></div>
      <div class="wave-layer wave-layer-2"></div>
      <div class="wave-layer wave-layer-3"></div>
    </div>
  </div>
  <div class="ripple-overlay">
    <div class="ripple ripple-1"></div>
    <div class="ripple ripple-2"></div>
    <div class="ripple ripple-3"></div>
    <div class="ripple ripple-4"></div>
    <div class="ripple ripple-5"></div>
  </div>
  <div class="ribbon">
  </div>
  <main>
    <section class="hero container">
      <img class="hero-logo" src="/static/gnome_logo_white.png" alt="gnome">
      <h1 id="animated-headline">All your files in one place, searchable by meaning</h1>
    </section>

    <div class="counter-wrap container" aria-label="signup counter">
      <div id="signup-counter" class="counter">1400 signed up already</div>
    </div>

    <section class="stage container" aria-label="Demo video">
      <div class="stage-inner">
        <iframe id="youtube-player" width="100%" height="100%"
          src="https://www.youtube.com/embed/w9f8Xj-bab4?mute=1&controls=0&showinfo=0&rel=0&modestbranding=1&iv_load_policy=3&disablekb=1&fs=0&cc_load_policy=0&autohide=1&wmode=transparent&enablejsapi=1&origin=https://gnom3.com&start=0&loop=1&playlist=w9f8Xj-bab4"
          title="Gnome Demo Video" frameborder="0"
          allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen style="border-radius: 16px;">
        </iframe>
      </div>
    </section>

    <section class="checkout container" aria-label="Join waitlist">
      <form class="waitlist-form" id="waitlist-form">
        <div class="input-group">
          <input type="email" placeholder="gnome@example.com" class="email-input" name="email" id="email-input"
            required>
          <button type="submit" class="join-btn" id="join-btn">
            <span class="btn-text">Join Waitlist</span>
            <span class="btn-loading" style="display: none;">Joining...</span>
          </button>
        </div>
      </form>
      <div class="thank-you-message" id="thank-you-message" style="display: none;">
        <p>Thank you for joining the waitlist</p>
      </div>
      <iframe name="hidden_iframe" style="display: none;"></iframe>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>Copyright © 2025 Gnome, Inc. All rights reserved.</p>
    </div>
  </footer>

  <script>

    // Store current count
    let currentCount = null;

    // Show loading message
    const counter = document.getElementById('signup-counter');
    counter.textContent = 'Loading signup count...';

    // Function to fetch and update signup count
    function fetchSignupCount() {
      fetch('https://script.google.com/macros/s/AKfycbwaKcezQRKC5qsA5jwd40tTXMtOJmVj6S1HDFAQQn-C5sHjbyE7UQBXQudKx88f7SM4DA/exec')
        .then(response => response.json())
        .then(data => {
          const newCount = data.count + 1400; // Add 1400 to the real count
          currentCount = newCount;
          displayCount(currentCount, true); // Show glow when count updates
        })
        .catch(error => {
          console.log('Could not fetch signup count:', error);
          // Keep current count if API fails
        });
    }

    // Fetch count immediately (but don't block page load)
    fetchSignupCount();

    // waves parallax animation
    const waves = document.querySelectorAll('.wave-layer');
    window.addEventListener('scroll', () => {
      const y = window.scrollY;
      waves.forEach((w, i) => {
        w.style.transform = `translateY(${y * (0.03 + i * 0.02)}px)`;
      });
    });

    // animate headline letters one by one
    const headline = document.getElementById('animated-headline');
    const originalText = headline.textContent;
    headline.innerHTML = '';

    // Check if mobile
    const isMobile = window.innerWidth <= 768;

    if (isMobile) {
      // For mobile, split at comma and create two lines
      const parts = originalText.split(', ');
      const firstLine = parts[0] + ',';
      const secondLine = parts[1];

      // Animate first line
      firstLine.split('').forEach((char, i) => {
        const span = document.createElement('span');
        span.textContent = char === ' ' ? '\u00A0' : char;
        span.style.opacity = '0';
        span.style.animation = `fadeInLetter 0.1s ease-out ${0.8 + i * 0.05}s forwards`;
        headline.appendChild(span);
      });

      // Add line break
      const br = document.createElement('br');
      headline.appendChild(br);

      // Animate second line
      secondLine.split('').forEach((char, i) => {
        const span = document.createElement('span');
        span.textContent = char === ' ' ? '\u00A0' : char;
        span.style.opacity = '0';
        span.style.animation = `fadeInLetter 0.1s ease-out ${0.8 + (firstLine.length + i) * 0.05}s forwards`;
        headline.appendChild(span);
      });
    } else {
      // Desktop - normal single line animation
      originalText.split('').forEach((char, i) => {
        const span = document.createElement('span');
        span.textContent = char === ' ' ? '\u00A0' : char;
        span.style.opacity = '0';
        span.style.animation = `fadeInLetter 0.1s ease-out ${0.8 + i * 0.05}s forwards`;
        headline.appendChild(span);
      });
    }

    // YouTube API to control video volume
    let player;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('youtube-player', {
        events: {
          'onReady': function (event) {
            // Set volume to 25% when ready
            player.setVolume(25);
          }
        }
      });
    }

    // Load YouTube API with error handling
    try {
      const tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      tag.onerror = function() {
        console.log('Failed to load YouTube API');
      };
      const firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    } catch (error) {
      console.log('Error loading YouTube API:', error);
    }

    // Function to update counter display with animations
    function displayCount(count, showGlow = false) {
      const newText = `${count} signed up already`;
      const counter = document.getElementById('signup-counter');
      counter.innerHTML = '';

      // Find the position of the last digit in the full text string
      const countString = count.toString();
      const lastDigitChar = countString[countString.length - 1];
      const spaceIndex = newText.indexOf(' '); // Find where the number ends
      const lastDigitIndex = spaceIndex - 1; // Last digit is just before the space

      newText.split('').forEach((char, i) => {
        const span = document.createElement('span');
        span.textContent = char === ' ' ? '\u00A0' : char;
        span.style.opacity = '1';
        span.style.position = 'relative';
        span.style.display = 'inline'; // Ensure inline display
        if (showGlow) {
          span.style.animation = `letterGlow 2s ease-in-out ${0.5 + i * 0.05}s infinite`;
        }

        // Add blinking underline only under the last digit of the number
        if (i === lastDigitIndex) {
          const underline = document.createElement('span');
          underline.textContent = '_';
          underline.style.position = 'absolute';
          underline.style.bottom = '-0.15em';
          underline.style.left = '50%';
          underline.style.transform = 'translateX(-50%)';
          underline.style.fontSize = '0.7em';
          underline.style.fontWeight = '900';
          underline.style.animation = `blink 1.5s ease-in-out ${5 + i * 0.05}s infinite`;
          span.appendChild(underline);
        }

        counter.appendChild(span);
      });
    }

    // Handle form submission
    document.getElementById('waitlist-form').addEventListener('submit', async function (e) {
      e.preventDefault(); // Prevent default form submission

      const form = document.getElementById('waitlist-form');
      const thankYouMessage = document.getElementById('thank-you-message');
      const emailInput = document.getElementById('email-input');
      const btnText = document.querySelector('.btn-text');
      const btnLoading = document.querySelector('.btn-loading');

      // Show loading state
      btnText.style.display = 'none';
      btnLoading.style.display = 'inline';

      try {
        // Submit to Apps Script
        const formData = new FormData();
        formData.append('email', emailInput.value);

        const response = await fetch('https://script.google.com/macros/s/AKfycbwaKcezQRKC5qsA5jwd40tTXMtOJmVj6S1HDFAQQn-C5sHjbyE7UQBXQudKx88f7SM4DA/exec', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (data.success) {
          // Update counter with real count + 1400
          currentCount = data.count + 1400;
          displayCount(currentCount, false);

          // Hide form and show thank you message
          form.style.display = 'none';
          thankYouMessage.style.display = 'block';
        } else {
          // Handle duplicate or error
          alert(data.message || 'Error submitting email. Please try again.');

          // Reset button
          btnText.style.display = 'inline';
          btnLoading.style.display = 'none';
        }

      } catch (error) {
        console.log('Submission error:', error);
        alert('Error submitting email. Please try again.');

        // Reset button
        btnText.style.display = 'inline';
        btnLoading.style.display = 'none';
      }
    });

  </script>
</body>

</html>
